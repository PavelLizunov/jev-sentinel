[package]
name = "jev-sentinel"
version = "0.1.0"
edition = "2021"
authors = ["Homelab & Open Source Contributors"]
description = "Universal, ultra-fast System 1 infrastructure watchdog and autonomous self-healing daemon powered by TypeSafe Jev"
license = "MIT"
readme = "README.md"
repository = "https://github.com/PavelLizunov/jev-sentinel"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "3.1"
