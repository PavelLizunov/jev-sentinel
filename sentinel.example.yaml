version: "1"

# TypeSafe AI Jev System 1 Settings
jev:
  api_key: "${TYPESAFE_API_KEY}"
  model: "jev-latest"
  base_url: "https://api.typesafe.ai"
  # Egress proxy for restricted/isolated networks (e.g. Russia, corporate VPNs)
  egress_proxy: "${JEV_EGRESS_PROXY:-http://10.0.0.2:8080}"
  timeout_seconds: 15

# Daemon Loop Settings
daemon:
  interval_seconds: 60
  concurrency: 8
  log_level: "info"

# Alerting Channels
alerting:
  telegram:
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    min_severity: "warning" # info, warning, critical
    # Optional: proxy for Telegram API (falls back to jev.egress_proxy or TELEGRAM_PROXY env var)
    proxy: "${TELEGRAM_PROXY:-http://10.0.0.2:8080}"

# Bounded Self-Healing Settings
self_healing:
  enabled: false
  allowed_services:
    - "core-service"
    - "caddy"
  require_confirmation: true

# Embedded Web Monitoring Dashboard (Zero Dependencies)
web:
  enabled: false
  listen: "127.0.0.1:8088"

# Monitored Targets
targets:
  # 1. macOS Host (Apple Silicon memory, swap, LaunchAgents)
  - type: macos_ssh
    name: "mac-host"
    host: "10.0.0.50"
    user: "admin"
    ssh_key: "~/.ssh/id_ed25519"
    timeout_seconds: 5
    check_services:
      - "core-service"

  # 2. Nvidia GPU Node (Temperature, VRAM, utilization)
  - type: nvidia_ssh
    name: "gpu-node"
    host: "10.0.0.60"
    user: "admin"
    ssh_key: "~/.ssh/id_ed25519"
    timeout_seconds: 5

  # 3. HTTP Healthchecks
  - type: http_probe
    name: "app-dashboard"
    url: "http://127.0.0.1:9119"
    expected_status: 200
    timeout_seconds: 3

  - type: http_probe
    name: "api-service"
    url: "http://10.0.0.20:8080/health"
    expected_status: 200
    timeout_seconds: 3

  # 4. TCP Service Reachability
  - type: tcp_ping
    name: "ingress-proxy"
    host: "10.0.0.15"
    port: 443
    timeout_seconds: 3

  # 5. Generic Script / Command Probe (Extensible without Rust recompilation!)
  - type: exec_probe
    name: "cluster-quorum"
    command:
      - "ssh"
      - "-o"
      - "BatchMode=yes"
      - "admin@10.0.0.10"
      - "pvecm status | grep -q 'Quorum: Yes' && echo '{\"quorum\": true}'"
    timeout_seconds: 5
