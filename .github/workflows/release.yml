name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: jev-sentinel
            archive_name: jev-sentinel-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: jev-sentinel
            archive_name: jev-sentinel-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz
            use_musl: true

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: jev-sentinel
            archive_name: jev-sentinel-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz

          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: jev-sentinel
            archive_name: jev-sentinel-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl tools (Linux musl target)
        if: matrix.use_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip debug symbols
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          elif [ "${{ runner.os }}" = "macOS" ]; then
            strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          fi

      - name: Package release archive
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/
          cp README.md LICENSE sentinel.example.yaml dist/
          tar -czvf ${{ matrix.archive_name }} -C dist .
          shasum -a 256 ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256

      - name: Upload artifact archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-archive
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS file
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
